# Freqtrade benchmark stack: DRY-RUN / BACKTEST ONLY. No exchange keys anywhere.
#
#   docker compose up -d                       -> start the dry-run bots
#   docker compose run --rm freqtrade <cmd>    -> one-off commands (backtesting, download-data, ...)
#
# Everything, including the dry-run trade databases (user_data/db/*.dryrun.sqlite), stays
# inside this project folder.

x-freqtrade-common: &ft-common
  image: freqtradeorg/freqtrade:stable
  volumes:
    - ./user_data:/freqtrade/user_data

services:
  # Utility service for one-off commands; never started by `docker compose up`.
  freqtrade:
    <<: *ft-common
    profiles: ["tools"]
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./scripts:/freqtrade/scripts:ro
    command: ["--version"]

  # Dry-run bot #1  ->  FreqUI at http://127.0.0.1:8080
  ft-bbandrsi:
    <<: *ft-common
    container_name: ft-bbandrsi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck: &ft-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/ping', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment: &ft-api-env
      FREQTRADE__API_SERVER__USERNAME: ${FT_API_USERNAME:?set in .env}
      FREQTRADE__API_SERVER__PASSWORD: ${FT_API_PASSWORD:?set in .env}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${FT_JWT_SECRET_KEY:?set in .env}
      FREQTRADE__API_SERVER__WS_TOKEN: ${FT_WS_TOKEN:?set in .env}
    command: >
      trade
      --logfile /freqtrade/user_data/logs/ft-bbandrsi.log
      --config /freqtrade/user_data/config.json
      --config /freqtrade/user_data/config.bot-bbandrsi.json

  # Dry-run bot #2  ->  FreqUI at http://127.0.0.1:8081
  ft-combinedbinhandcluc:
    <<: *ft-common
    container_name: ft-combinedbinhandcluc
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck: *ft-health
    environment: *ft-api-env
    command: >
      trade
      --logfile /freqtrade/user_data/logs/ft-combinedbinhandcluc.log
      --config /freqtrade/user_data/config.json
      --config /freqtrade/user_data/config.bot-combinedbinhandcluc.json

