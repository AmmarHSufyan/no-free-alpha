[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "no-free-alpha"
version = "1.0.0"
description = "Cost-aware backtests and walk-forward copy-trading replays of retail crypto strategies (indicator bots, LLM agents, Hyperliquid copy trading, trend following)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["ccxt>=4.4", "pandas>=2.2", "numpy>=2.0", "pyarrow>=15"]
keywords = ["cryptocurrency", "backtesting", "copy-trading", "hyperliquid", "llm-trading", "transaction-costs", "trend-following"]

[project.optional-dependencies]
bulk = ["boto3>=1.34", "lz4>=4.3", "orjson>=3.9"]   # Hyperliquid full-ledger job (bot/copylab/bulk)
figures = ["matplotlib>=3.8"]                       # paper/make_figures.py
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.setuptools.package-data]
"bot.copylab.bulk" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
